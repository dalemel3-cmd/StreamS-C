name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KS_B64: ${{ secrets.MASON_TV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MASON_TV_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mason-tv.jks"
            echo "MASON_TV_KEYSTORE_FILE=$RUNNER_TEMP/mason-tv.jks" >> "$GITHUB_ENV"
            echo "MASON_TV_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set; building an unsigned APK (not installable)."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" != "1" ]; then
            echo "::error::Add MASON_TV_KEYSTORE_B64 and MASON_TV_KEYSTORE_PASSWORD repo secrets to publish a signed APK."
            exit 1
          fi
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="android-v$VC"
          cp app/build/outputs/apk/release/app-release.apk "hpd-tv-v$VC.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "hpd-tv-v$VC.apk" --clobber
          else
            gh release create "$TAG" "hpd-tv-v$VC.apk" --prerelease --title "HPD TV APK v$VC" --notes "Built from ${GITHUB_SHA::7}. Install: adb install -r hpd-tv-v$VC.apk"
          fi
